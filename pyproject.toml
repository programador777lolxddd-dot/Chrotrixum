[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrotrixum"
version = "0.1.0"
description = "Navegador de escritorio experimental basado en PyQt6 y QtWebEngine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
]

[project.scripts]
chrotrixum = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
